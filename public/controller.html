<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080910"><title>PLAYBOX 5 Controller</title><link rel="stylesheet" href="/controller.css"></head><body><main class="remote"><header><div class="logo"><span>P</span> PLAYBOX <b>5</b></div><div class="status" id="status"><i></i> Connecting…</div></header><section class="connect-error" id="connect-error" hidden><h1>Can't connect</h1><p>Check that your TV is open on PLAYBOX 5 and both devices are on the same Wi-Fi network.</p><button onclick="location.reload()">Try again</button></section><section class="controller" id="controller" hidden><div class="top-buttons"><button data-btn="create" class="small-round">☰<small>CREATE</small></button><button data-btn="home" class="home-button">P5</button><button data-btn="options" class="small-round">⋯<small>OPTIONS</small></button></div><div class="controls"><div class="dpad"><button data-btn="up" class="up">▲</button><button data-btn="left" class="left">◀</button><button data-btn="confirm" class="center">✦</button><button data-btn="right" class="right">▶</button><button data-btn="down" class="down">▼</button></div><div class="face"><button data-btn="triangle" class="tri">△</button><button data-btn="square" class="sqr">□</button><button data-btn="circle" class="cir">○</button><button data-btn="cross" class="cross">×</button></div></div><div class="shoulders"><button data-btn="l1">L1</button><button data-btn="l2">L2</button><span>TOUCH CONTROLLER</span><button data-btn="r2">R2</button><button data-btn="r1">R1</button></div><div class="sticks"><div class="stick-area" data-axis="left"><div class="stick"><i></i></div><small>LEFT STICK</small></div><div class="stick-area" data-axis="right"><div class="stick"><i></i></div><small>RIGHT STICK</small></div></div><div class="bottom-actions"><button data-btn="back">BACK</button><button data-btn="pause">Ⅱ PAUSE</button><button data-btn="confirm">OK / ENTER</button></div><p class="tip">Keep this screen open while playing. Touch buttons to send controls to your TV.</p></section></main><script src="/controller.js"></script></body></html>
